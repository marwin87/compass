[project]
name = "compass"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.mypy]
strict = true


[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
