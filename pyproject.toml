[project]
name = "compass"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.5",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
# Browser tests (tests/e2e) are opt-in: `uv run pytest -m e2e`. A plain run, and CI, never need a browser.
markers = ["e2e: browser tests of the main flows, run locally with -m e2e"]
addopts = "-m 'not e2e' --tracing=retain-on-failure --screenshot=only-on-failure"

[tool.coverage.run]
source = ["compass"]
branch = true

[tool.coverage.report]
fail_under = 80          # measured 98% when this was added; raise it as coverage grows
show_missing = true
skip_covered = true


[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
