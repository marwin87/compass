default_install_hook_types: [ pre-commit, commit-msg, pre-push ]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [ python ]
        files: ^(app|tests)/
        stages: [ pre-commit ]

      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [ python ]
        files: ^(app|tests)/
        stages: [ pre-commit ]

      - id: mypy
        name: mypy
        entry: uv run mypy app
        language: system
        pass_filenames: false
        files: ^app/
        stages: [ pre-commit ]

      # Exit code 5 means "no tests collected"; tolerated until the first tests exist.
      - id: pytest
        name: pytest
        entry: bash -c 'uv run pytest -q || [ $? -eq 5 ]'
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-push ]
